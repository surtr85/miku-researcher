<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Ocean Abyss Gradient -->
    <radialGradient id="abyss-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="40%" stop-color="#021c22" />
      <stop offset="100%" stop-color="#000000" />
    </radialGradient>

    <!-- The Crystalline Glass Facets -->
    <linearGradient id="glass-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="glass-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glowing Core Point -->
    <radialGradient id="miku-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="20%" stop-color="#5eead4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle texture -->
    <pattern id="dust" width="400" height="400" patternUnits="userSpaceOnUse">
      <circle cx="120" cy="50" r="0.8" fill="#5eead4" fill-opacity="0.1" />
      <circle cx="280" cy="180" r="1.5" fill="#5eead4" fill-opacity="0.05" />
      <circle cx="50" cy="320" r="1" fill="#5eead4" fill-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="#000000" />
  <rect width="1200" height="420" fill="url(#abyss-glow)" />

  <g transform="translate(600, 210)">
    <!-- Core Glow -->
    <circle cx="0" cy="0" r="180" fill="url(#miku-core)" />

    <!-- The Crystal Artifact (Constructivist / Geometric) -->
    <!-- Outer delicate bounds -->
    <polygon points="0,-160 140,0 0,160 -140,0" fill="none" stroke="#0d9488" stroke-width="0.5" stroke-opacity="0.5" />
    <polygon points="0,-220 30,-90 190,0 30,90 0,220 -30,90 -190,0 -30,-90" fill="none" stroke="#2dd4bf" stroke-width="0.5" stroke-opacity="0.3" />

    <!-- Inner Facets Layer 1 (Glass 1) -->
    <polygon points="0,-120 70,0 0,120 -70,0" fill="url(#glass-1)" />
    <!-- Inner Facets Layer 2 (Glass 2) -->
    <polygon points="-40,-60 80,-40 40,60 -80,40" fill="url(#glass-2)" />
    <!-- Inner Facets Layer 3 -->
    <polygon points="0,-180 12,-40 80,-10 12,20 0,180 -12,20 -80,-10 -12,-40" fill="none" stroke="#ccfbf1" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Sacred Geometry Line work -->
    <line x1="0" y1="-280" x2="0" y2="280" stroke="#5eead4" stroke-width="1" stroke-opacity="0.8" />
    <line x1="-350" y1="0" x2="350" y2="0" stroke="#5eead4" stroke-width="0.5" stroke-opacity="0.6" />
    <line x1="-120" y1="-120" x2="120" y2="120" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.4" />
    <line x1="120" y1="-120" x2="-120" y2="120" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.4" />

    <!-- The Singularity -->
    <polygon points="0,-15 10,0 0,15 -10,0" fill="#ffffff" />
  </g>

  <!-- Dust / Atmospheric noise -->
  <rect width="1200" height="420" fill="url(#dust)" />

  <!-- Typography -->
  <g transform="translate(60, 360)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', serif" font-size="26" font-weight="200" fill="#ccfbf1" letter-spacing="10">
      M I K U — R E S E A R C H E R
    </text>
    <text x="5" y="24" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro', monospace" font-size="9" font-weight="400" fill="#5eead4" letter-spacing="5" opacity="0.6">
      DEEP WEB SYNTHESIS
    </text>
  </g>

  <!-- Frame -->
  <rect x="30" y="30" width="1140" height="360" fill="none" stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.15" />

  <!-- Abstract coordinates / markers -->
  <text x="45" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5eead4" letter-spacing="2" opacity="0.5">
    MODE: AUTONOMOUS
  </text>
  <text x="1155" y="55" font-family="'JetBrains Mono', monospace" font-size="8" fill="#5eead4" letter-spacing="2" text-anchor="end" opacity="0.5">
    MCP // ZERO-CGO
  </text>

</svg>